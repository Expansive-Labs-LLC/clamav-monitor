name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write        # create releases and push the version commit
  issues: write          # comment on released issues
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # The version-bump commit is tagged [skip ci], but guard anyway so a
    # release can never trigger another release.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # semantic-release needs full history
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil fakeroot

      - run: npm ci

      # semantic-release runs `npm run dist` in its prepare step, after the
      # version in package.json has been bumped, so the .deb filename and
      # embedded version match the release tag.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
